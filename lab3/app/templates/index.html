<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">Data Analysis Platform</h1>
        
        <div class="card shadow mb-5">
            <div class="card-header bg-primary text-white">
                <h4>1. Upload Your Data</h4>
            </div>
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="dataFile" class="form-label">Select CSV or Excel file</label>
                        <input class="form-control" type="file" id="dataFile" accept=".csv,.xlsx" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
                <div id="uploadStatus" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card shadow mb-5" id="analysisSection" style="display: none;">
            <div class="card-header bg-success text-white">
                <h4>2. Configure Analysis</h4>
            </div>
            <div class="card-body">
                <form id="analysisForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="targetColumn" class="form-label">Target Variable</label>
                            <select class="form-select" id="targetColumn" required></select>
                        </div>
                        <div class="col-md-6">
                            <label for="featureColumns" class="form-label">Features</label>
                            <select class="form-select" id="featureColumns" multiple></select>
                            <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Analyze Data</button>
                </form>
                <div id="analysisStatus" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card shadow" id="resultsSection" style="display: none;">
            <div class="card-header bg-info text-white">
                <h4>3. Analysis Results</h4>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" id="resultsTabs">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#stats">Statistics</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#visualizations">Visualizations</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#model">Model</button>
                    </li>
                </ul>
                
                <div class="tab-content py-4">
                    <div class="tab-pane fade show active" id="stats">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Descriptive Statistics</h5>
                                <div class="table-responsive" id="descriptiveStats"></div>
                            </div>
                            <div class="col-md-6">
                                <h5>Missing Values</h5>
                                <div class="table-responsive" id="missingValues"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tab-pane fade" id="visualizations">
                        <div id="plotsContainer" class="row"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="model">
                        <div id="modelResults"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
